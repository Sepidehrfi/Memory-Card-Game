<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">  
    <title>Memory Card Game</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
  <div class="controls">
    <label for="pairCount">Number of pairs of images:</label>
    <input type="number" id="pairCount" min="2" max="20" value="8">
    <button id="startGame">Start game</button>
  </div>

  <div class="wrapper">
    <ul class="cards"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
